<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // iPhones and iPads zoom in on a text box with text under 16px (the journal's is 15px on a phone);
      // maximum-scale stops that there, and pinch-zoom still works on them. Not set elsewhere: on Android
      // it would block pinch-zoom.
      if (/iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
        const viewport = document.querySelector('meta[name="viewport"]')
        viewport.content += ', maximum-scale=1'
      }
    </script>
    <script>
      // Light or dark before the first paint, so a dark page never flashes white (lib/theme.ts keeps it
      // up to date after that): the choice from Settings, else the device's setting; and the colorblind-
      // friendly colours when they're on ("dark-colorblind" was their theme before they became a switch).
      try {
        const choice = localStorage.getItem('mai-tutor:theme')
        const colorblind = choice === 'dark-colorblind' || localStorage.getItem('mai-tutor:colorblind') === '1'
        const dark = choice === 'dark' || choice === 'dark-colorblind' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        if (colorblind) document.documentElement.dataset.palette = 'colorblind'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <title>Mai</title>
    <meta
      name="description"
      content="Mai: learn Vietnamese or Spanish from the words you actually use. Write a journal and get corrections in your dialect, with cheatsheets of your own words."
    />
    <!-- Space Grotesk, the app's font, and Playpen Sans for the journal pages (both have Vietnamese). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playpen+Sans:wght@100..800&family=Space+Grotesk:wght@300..700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
